
services:
  postgresdb:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: waterbilldb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - springboot-postgres-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d waterbilldb"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    image: parameswar1427/docker-git-actions-task-backend:latest
    container_name: docker-springboot
    ports:
      - "2007:1427"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresdb:5432/waterbilldb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: docker
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
    depends_on:
      postgresdb:
        condition: service_healthy
    restart: on-failure
    networks:
      - springboot-postgres-net

  frontend:
    image: parameswar1427/docker-git-actions-task-frontend:latest
    container_name: docker-react
    ports:
      - "3004:80"
    depends_on:
      - backend
    restart: on-failure
    networks:
      - springboot-postgres-net

volumes:
  postgres_data:

networks:
  springboot-postgres-net:
